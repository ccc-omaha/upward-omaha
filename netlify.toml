[build]
  publish = "."
  command = "node build.js"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# old Squarespace paths
[[redirects]]
  from = "/cart"
  to = "/"
  status = 301
