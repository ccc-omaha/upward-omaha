<!DOCTYPE html>
<html><head><meta charset="utf-8">
<!-- Source for images/share.jpg, the 1200x630 link preview. Rendered once with headless Chrome; not part of the Netlify build. -->
<link rel="stylesheet" href="https://use.typekit.net/ohw6ayv.css">
<style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;overflow:hidden;background:#00003D;font-family:"proxima-nova",sans-serif;color:#fff;position:relative}
.stripes{position:absolute;inset:0;background:repeating-linear-gradient(100deg,rgba(255,255,255,.04) 0 90px,transparent 90px 180px)}
.ring{position:absolute;right:-160px;top:-120px;width:560px;height:560px;border:3px solid rgba(255,255,255,.08);border-radius:50%}
.copy{position:absolute;left:70px;top:64px;width:600px}
.logo{height:62px;display:block;margin-bottom:38px}
h1{font-weight:900;font-style:italic;text-transform:uppercase;font-size:86px;line-height:.92;letter-spacing:-.01em}
h1 span{color:#FF8017}
.chips{display:flex;gap:12px;margin-top:36px}
.chip{display:flex;align-items:center;gap:10px;padding:12px 20px;border-radius:999px;font-weight:800;font-size:22px;text-transform:uppercase;font-style:italic}
.chip svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.s{background:#0083E0}.f{background:#FF8017}.c{background:#D81159}
.url{position:absolute;left:70px;bottom:44px;font-weight:700;font-size:22px;color:#8DE2E0;letter-spacing:.06em}
.url b{color:#fff;font-weight:800}
.photo{position:absolute;right:56px;top:58px;width:430px;height:520px;border-radius:28px;border:7px solid #fff;overflow:hidden;transform:rotate(3deg);box-shadow:0 30px 60px rgba(0,0,0,.45)}
.photo img{width:100%;height:100%;object-fit:cover;object-position:center 35%}
.ball{position:absolute;right:420px;bottom:30px;width:120px;height:120px;transform:rotate(18deg);filter:drop-shadow(0 12px 16px rgba(0,0,0,.4))}
.sticker{position:absolute;right:36px;top:30px;width:132px;height:132px;border-radius:50%;background:#FF8017;color:#00003D;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:900;font-style:italic;text-transform:uppercase;font-size:17px;line-height:.95;text-align:center;transform:rotate(-10deg);box-shadow:0 10px 24px rgba(0,0,0,.35)}
.sticker svg{width:46px;height:46px;stroke:#00003D;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
</style></head>
<body>
<div class="stripes"></div><div class="ring"></div>
<div class="copy">
  <img class="logo" src="../images/upward-logo.png" alt="">
  <h1>Every kid gets in the <span>game.</span></h1>
  <div class="chips">
    <span class="chip s"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M12 7.5l4 2.9-1.5 4.7h-5l-1.5-4.7z"/><path d="M12 7.5V3M16 10.4l4.2-1.4M14.5 15.1l2.7 3.6M9.5 15.1l-2.7 3.6M8 10.4L3.8 9"/></svg>Soccer</span>
    <span class="chip f"><svg viewBox="0 0 24 24"><path d="M4.2 19.8C2 13 6 5 19.8 4.2 22 11 18 19 4.2 19.8z"/><path d="M8 16l8-8M10 11.5l2.5 2.5M12 9.5l2.5 2.5M5 13.5l5.5 5.5M13.5 5l5.5 5.5"/></svg>Flag football</span>
    <span class="chip c"><svg viewBox="0 0 24 24"><path d="M12 13L5 5M12 13V3M12 13l7-8M12 13L3 11M12 13l9-2"/><path d="M10.5 14h3v7h-3z"/></svg>Cheer</span>
  </div>
</div>
<p class="url"><b>UPWARDOMAHA.COM</b> &nbsp;·&nbsp; OMAHA, NE</p>
<div class="photo"><img src="../images/hero-soccer.jpg" alt=""></div>
<svg class="ball" viewBox="0 0 100 100"><defs><clipPath id="c"><circle cx="50" cy="50" r="46"/></clipPath></defs><circle cx="50" cy="50" r="46" fill="#fff" stroke="#00003D" stroke-width="4"/><g clip-path="url(#c)" fill="#00003D"><path d="M50 33 L66 45 L60 64 L40 64 L34 45Z"/><path d="M50 2 L62 10 L58 20 L42 20 L38 10Z"/><path d="M95 36 L98 52 L88 58 L80 46 L86 34Z"/><path d="M78 92 L64 98 L58 86 L66 76 L80 80Z"/><path d="M22 92 L36 98 L42 86 L34 76 L20 80Z"/><path d="M5 36 L2 52 L12 58 L20 46 L14 34Z"/></g><g stroke="#00003D" stroke-width="3" fill="none"><path d="M50 33 V20 M66 45 L80 46 M60 64 L66 76 M40 64 L34 76 M34 45 L20 46"/></g></svg>
<div class="sticker"><svg viewBox="0 0 24 24"><path d="M2 7.5h11.5"/><path d="M2 7.5v4l6.2 1.3"/><circle cx="14.5" cy="14" r="6.5"/><circle cx="14.5" cy="14" r="1.6"/><path d="M11 7.5V5.5h3"/></svg>Everyone<br>plays</div>
</body></html>
